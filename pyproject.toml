[project]
name = "lrdsr-clustering"
version = "1.0.0"
description = "Latent-regime clustering by symbolic law: the method and its analysis"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dror Jacoby" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26", "pandas>=2.0", "scipy>=1.11",
    "scikit-learn>=1.3", "matplotlib>=3.8", "joblib>=1.3",
]

[project.urls]
Repository = "https://github.com/drorjac/lrdsr-clustering"

[project.optional-dependencies]
# Open-ended symbolic-regression engines, used only by the optional refine
# step (lrdsr.core.refine) and experiments/openlaws. The default needs neither.
# PySR is pinned below 2 because 2.x needs sympy >= 1.14.
engines = ["pysr>=0.18,<2"]
dev = ["pytest>=7.4", "ruff>=0.4", "nbformat", "nbclient", "nbconvert", "ipykernel"]

[tool.setuptools.packages.find]
include = ["lrdsr*", "experiments*", "analysis*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Numerical code carried over verbatim from the parent project. Style is not
# reviewed there on purpose: a restyle would silently change committed
# numbers, and the point of carrying it over is that it is the same code.
# The ignore is deliberately narrow -- F (real errors) still applies.
"experiments/*" = ["E7", "E9", "B", "C4", "RUF", "UP"]
"lrdsr/theory/verification.py" = ["E7"]
# Generated notebooks read top to bottom: imports sit where they are first
# used, and short cells chain statements. Style only -- F and the rest apply.
"notebooks/*.ipynb" = ["E401", "E402", "E702", "I001", "B007", "B905"]
